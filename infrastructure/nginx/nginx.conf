# Reverse proxy for production deployment (Phase 8).
# Routes the dashboard at "/" and the API at "/api/*" behind one host,
# and proxies Twilio Media Streams' WebSocket upgrade to the API.

events {}

http {
  upstream dashboard_upstream {
    server dashboard:3000;
  }

  upstream api_upstream {
    server api:3001;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://api_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://dashboard_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
